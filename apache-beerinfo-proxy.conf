# Apache reverse proxy example for BeerInfo-AutoCreate
# 1) Enable required modules:
#    a2enmod proxy proxy_http headers
#
# 2) Put this in the target VirtualHost or include file.
#
# 3) The HTML page uses:
#    - /beer-create.csv  (already served by Apache)
#    - /execute          (proxied to local FastAPI)

<VirtualHost *:8888>
    ServerName yazu.x5300.com

    DocumentRoot /var/www/8888

    ProxyRequests Off
    ProxyPreserveHost On

    # Static CSV is served directly by Apache from the document root
    # /beer-create.csv

    # Forward execute requests to local FastAPI service
    ProxyPass /execute http://127.0.0.1:8080/execute
    ProxyPassReverse /execute http://127.0.0.1:8080/execute

    # Optional: if you want /beergarden to be handled by the local service too
    ProxyPass /beergarden http://127.0.0.1:8080/beergarden
    ProxyPassReverse /beergarden http://127.0.0.1:8080/beergarden

    Header always set Access-Control-Allow-Origin "http://yazu.x5300.com:8888"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type"
</VirtualHost>
