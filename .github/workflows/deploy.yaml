name: Deploy Beerinfo API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update code
        run: |
          cd /opt/beerinfo
          git pull

      - name: Install dependencies
        run: |
          pip install -r /opt/beerinfo/requirements.txt

      - name: Restart API service
        run: |
          sudo systemctl restart beerinfo-api.service
          sudo systemctl status beerinfo-api.service --no-pager
